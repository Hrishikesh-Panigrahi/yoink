name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pip install pytest responses
          pytest tests/ -q

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path src/version.py -Pattern "__version__"
          $value = ($line.Line -split "=")[1].Trim().Trim('"').Trim("'")
          "version=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build EXE
        run: python build.py --exe-only

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\yoink.iss

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoink-${{ steps.version.outputs.version }}-windows
          path: |
            dist/Yoink.exe
            dist/Yoink-Setup-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Yoink.exe
            dist/Yoink-Setup-*.exe
          generate_release_notes: true
