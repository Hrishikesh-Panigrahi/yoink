name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      # python-vlc is only a binding; build.py copies libvlc.dll, libvlccore.dll
      # and the plugin tree out of this install and into the bundle. Without it
      # the build fails rather than shipping a dead player.
      - name: Install VLC (bundled into the exe)
        run: choco install vlc --no-progress -y

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\src
          TORRENT_DB_PATH: ${{ runner.temp }}\yoink-release-test.db
        run: |
          pytest tests/ -q

      # Ask build.py rather than re-parsing version.py here. The previous
      # Select-String matched the module docstring as well as the assignment,
      # so v2.1.0 shipped as Yoink-Setup-__version__.exe with __version__ as
      # its registered version. One parser, one place.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $value = (python build.py --print-version).Trim()
          if (-not ($value -match '^\d+\.\d+\.\d+')) {
            throw "build.py --print-version returned '$value', which is not a version"
          }
          "version=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building version $value"

      - name: Build EXE
        run: python build.py --exe-only

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\yoink.iss

      # The download page needs a filename that stays the same across
      # releases. Keep the versioned copy too, for archiving.
      - name: Add stable-named installer alias
        shell: pwsh
        run: |
          $versioned = Get-ChildItem dist\Yoink-Setup-*.exe | Select-Object -First 1
          if (-not $versioned) { throw "no versioned installer found in dist/" }
          Copy-Item $versioned.FullName dist\Yoink-Setup.exe -Force
          Write-Host "aliased $($versioned.Name) -> Yoink-Setup.exe"

      - name: Generate checksums
        shell: pwsh
        run: |
          # The APK is built elsewhere. If one has been dropped into dist/ it
          # gets hashed with everything else; if not, this still works.
          $files = @()
          $files += (Get-ChildItem dist\Yoink.exe, dist\Yoink-Setup.exe | ForEach-Object FullName)
          $files += (Get-ChildItem dist\Yoink-Setup-*.exe | ForEach-Object FullName)
          $apk = Get-ChildItem dist -Filter *.apk
          if ($apk) { $files += ($apk | ForEach-Object FullName) }
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yoink-${{ steps.version.outputs.version }}-windows
          path: |
            dist/Yoink.exe
            dist/Yoink-Setup.exe
            dist/Yoink-Setup-*.exe
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Yoink.exe
            dist/Yoink-Setup.exe
            dist/Yoink-Setup-*.exe
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
