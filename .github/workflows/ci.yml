name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  # Ruff is pure Python and platform-independent, so this runs on Linux rather
  # than paying for a Windows runner. It installs only ruff — the runtime deps
  # (PyQt6, libtorrent) have no Linux wheels here and lint does not need them.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned by requirements-dev.txt so local and CI agree on the version.
        run: pip install "$(grep '^ruff' requirements-dev.txt)"

      - name: Run ruff
        run: ruff check .

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\src
          TORRENT_DB_PATH: ${{ runner.temp }}\yoink-test.db
        run: pytest tests/ -q
