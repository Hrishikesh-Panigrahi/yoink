  <!-- Keyboard shortcuts panel (7.5) -->
  <div class="modal-backdrop" id="shortcutsBackdrop" role="dialog" aria-modal="true" aria-labelledby="shortcutsTitle" hidden>
    <div class="modal modal-small">
      <header class="modal-header">
        <h2 id="shortcutsTitle">Keyboard shortcuts</h2>
        <p class="modal-tag">Press <kbd>?</kbd> any time to open this panel.</p>
      </header>
      <div class="modal-body">
        <dl class="shortcuts">
          <dt><kbd>/</kbd></dt><dd>Focus the search bar</dd>
          <dt><kbd>?</kbd></dt><dd>Show this shortcuts panel</dd>
          <dt><kbd>Ctrl</kbd>+<kbd>F</kbd></dt><dd>Focus the search bar</dd>
          <dt><kbd>Ctrl</kbd>+<kbd>D</kbd></dt><dd>Open Downloads</dd>
          <dt><kbd>Ctrl</kbd>+<kbd>,</kbd></dt><dd>Open Settings</dd>
          <dt><kbd>Esc</kbd></dt><dd>Close the current modal / dropdown</dd>
        </dl>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-primary" id="shortcutsClose">Close</button>
      </footer>
    </div>
  </div>
