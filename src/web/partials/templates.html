  <template id="resultRowTpl">
    <article class="result-row" role="listitem">
      <div class="poster-wrap">
        <img class="poster" hidden alt="" />
        <div class="poster placeholder">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        </div>
      </div>
      <div class="result-main">
        <div class="result-title"></div>
        <div class="result-meta">
          <span class="meta source"></span>
          <span class="meta size"></span>
          <span class="meta date" hidden></span>
          <span class="meta runtime" hidden></span>
          <span class="meta quality" hidden></span>
          <span class="meta rating" hidden></span>
          <a class="meta imdb-link" hidden target="_blank" rel="noopener">IMDb</a>
          <span class="meta safety-badge" hidden></span>
        </div>
        <div class="result-genres" hidden></div>
        <div class="result-summary" hidden></div>
      </div>
      <div class="result-stats">
        <div class="stat-line seeders" title="Seeders: people who have the complete file and are sharing it. More seeders = faster download.">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          <span class="num"></span>
          <span>seeders</span>
        </div>
        <div class="stat-line peers" title="Peers: people downloading the file from you. They don't speed up your download.">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 5v14"/><path d="m5 12 7 7 7-7"/></svg>
          <span class="num"></span>
          <span>peers</span>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn btn-ghost result-info" title="Movie details" aria-label="Show details">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
        </button>
        <button class="btn btn-primary result-action">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          Download
        </button>
      </div>
    </article>
  </template>

  <template id="downloadRowTpl">
    <article class="download-row" role="listitem">
      <header class="download-head">
        <h3 class="dl-name"></h3>
        <span class="status-chip"></span>
      </header>
      <div class="dl-progress-wrap">
        <div class="dl-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span class="dl-bar"></span></div>
        <span class="dl-progress-text"></span>
      </div>
      <div class="dl-meta">
        <span class="dl-stat"><span class="dl-label">Size</span><span class="dl-value dl-size"></span></span>
        <span class="dl-stat"><span class="dl-label">Down</span><span class="dl-value dl-down"></span></span>
        <span class="dl-stat"><span class="dl-label">ETA</span><span class="dl-value dl-eta"></span></span>
        <span class="dl-stat"><span class="dl-label">Seeds</span><span class="dl-value dl-seeds"></span></span>
        <span class="dl-stat"><span class="dl-label">Peers</span><span class="dl-value dl-peers"></span></span>
      </div>
      <div class="dl-actions">
        <button class="btn btn-primary dl-open-file" hidden title="Open the downloaded file">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="m7 5 12 7-12 7Z"/></svg>
          Open file
        </button>
        <button class="btn btn-ghost dl-pause" hidden>Pause</button>
        <button class="btn btn-ghost dl-resume" hidden>Resume</button>
        <button class="btn btn-ghost dl-open">Open folder</button>
        <button class="btn btn-ghost dl-cancel" type="button" title="Cancel and remove" aria-label="Cancel and remove">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/></svg>
        </button>
        <div class="dl-kebab-wrap">
          <button class="btn btn-ghost dl-kebab" aria-haspopup="true" aria-expanded="false" aria-label="More actions" title="More">
            <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
          </button>
          <div class="dl-menu" role="menu" hidden>
            <button type="button" class="dl-menu-item dl-pick-files" role="menuitem">
              <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              Pick files...
            </button>
            <button type="button" class="dl-menu-item dl-open-menu" role="menuitem">
              <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              Open folder
            </button>
            <button type="button" class="dl-menu-item dl-move-folder" role="menuitem">
              <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              Move to folder...
            </button>
            <button type="button" class="dl-menu-item dl-labels" role="menuitem">
              <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M20 13.5 13.5 20a2 2 0 0 1-2.8 0l-7-7V4h9z"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
              Labels...
            </button>
            <button type="button" class="dl-menu-item dl-copy-magnet" role="menuitem">
              <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M9 9h11v11H9z"/><path d="M5 5h10v3H8v7H5z"/></svg>
              Copy info hash
            </button>
            <hr class="dl-menu-sep" />
            <button type="button" class="dl-menu-item is-danger dl-remove" role="menuitem">
              <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/></svg>
              Remove from list
            </button>
            <button type="button" class="dl-menu-item is-danger dl-remove-files" role="menuitem">
              <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 7h16"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M10 11v6M14 11v6"/></svg>
              Remove and delete files
            </button>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
